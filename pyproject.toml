[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "crypto-eip1559-block-builder"
version = "0.1.0"
description = "Simulate nonce-constrained fee-priority packing, base-fee updates, fee burning and validator tips."
requires-python = ">=3.11"
license = "MIT"

[project.scripts]
crypto-eip1559-block-builder = "cryptolab:main"

[tool.setuptools.packages.find]
include = ["cryptolab*"]

[tool.setuptools.package-data]
cryptolab = ["web/*"]
